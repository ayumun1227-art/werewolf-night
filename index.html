</style></head><body><main id="app"><h1>人狼 NIGHT</h1><p>ゲームを読み込んでいます…</p><noscript>JavaScriptを有効にしてください。</noscript></main><script>
(()=>{"use strict";
const R={W:'人狼',F:'狂信者',S:'占い師',M:'霊媒師',G:'騎士',B:'パン屋',H:'ハンター',P:'共有者',L:'村長',D:'探偵',V:'見張り',C:'村人'};
const E={W:'🐺',F:'😈',S:'🔮',M:'👻',G:'🛡️',B:'🥐',H:'🎯',P:'🤝',L:'👑',D:'🔍',V:'👁️',C:'🌱'};
const desc={W:'仲間と夜の襲撃先を選ぶ',F:'人狼を知る人狼陣営。占い結果は人狼ではない',S:'毎晩1人が人狼か調べる',M:'直前の投票で退場した人が人狼か知る',G:'毎晩自分以外の1人を守る',B:'生存中は朝にパンが焼かれる',H:'退場時に1人を道連れにする',P:'相方を知る',L:'投票が2票になる',D:'毎晩1人の陣営を調べる',V:'毎晩1人が夜の能力を持つか調べる',C:'議論と投票で人狼を探す'};
const presets={6:'WFSGBH',7:'WFSMGBH',8:'WWFSMGBH',9:'WWFSMGBHL',10:'WWFSMGBHPP',11:'WWWFSMGBHPP',12:'WWWFSMGBHPPL',13:'WWWFSMGBHPPLD',14:'WWWFSMGBHPPLDV',15:'WWWWFSMGBHPPLDV'};
const roles=n=>presets[n].split('');const fresh=()=>({n:12,names:Array(15).fill(''),phase:'setup',p:[],i:0,open:false,day:1,actions:{},votes:{},last:-1,msg:'',hunter:-1,after:'',win:'',until:0,remaining:300,custom:null,investigation:null});
let s=fresh();try{let v=JSON.parse(localStorage.getItem('ww-night-v2'));if(v&&presets[v.n]&&v.phase)s=v}catch(e){}s.open=false;let pick=-1;const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),alive=()=>s.p.filter(p=>p.alive),name=id=>s.p[id]?.name||'',save=()=>{try{localStorage.setItem('ww-night-v2',JSON.stringify({...s,open:false}))}catch(e){}},btn=(t,a,alt=false,disabled=false)=>'<button data-a="'+a+'" class="'+(alt?'alt':'')+'" '+(disabled?'disabled':'')+'>'+t+'</button>',opts=ps=>ps.map(p=>'<button class="alt '+(pick===p.id?'selected':'')+'" data-p="'+p.id+'">'+(pick===p.id?'✓ ':'')+esc(p.name)+'</button>').join(''),go=p=>{s.phase=p;s.i=0;s.open=false;pick=-1;s.investigation=null;render()},shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gate(p,action='open'){return '<section class="gate center"><div class="big">🔒</div><h2>'+esc(p.name)+' さんの番</h2><p>本人だけ画面を見てください。</p>'+btn('秘密画面を開く',action)+'</section>'}
function render(){save();let h='<header>🐺 人狼 NIGHT <small>'+(s.phase==='setup'?'設定':s.day+'日目')+'</small></header>';
if(s.phase==='setup'){let rr=s.custom||roles(s.n);h+='<h1>今夜、誰が人狼？</h1><p>司会不要・スマホ1台で全員参加</p><section><label>参加人数<select id="num">'+Array.from({length:10},(_,i)=>i+6).map(n=>'<option '+(n===s.n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><h3>名前登録</h3><div class="grid">'+Array.from({length:s.n},(_,i)=>'<input maxlength="20" data-name="'+i+'" placeholder="'+(i+1)+'人目" value="'+esc(s.names[i])+'">').join('')+'</div></section><section><h3>役職構成（変更可能）</h3><div class="grid">'+rr.map((r,i)=>'<select aria-label="役職'+(i+1)+'" data-role="'+i+'">'+Object.keys(R).map(k=>'<option value="'+k+'" '+(r===k?'selected':'')+'>'+E[k]+' '+R[k]+'</option>').join('')+'</select>').join('')+'</div>'+btn('標準配役に戻す','preset',true)+'</section>'+btn('ゲーム開始','start')+'<p id="error" role="alert"></p><small>名前とゲーム状態は端末内だけに保存します。秘密画面は他人に見せないでください。</small><p><small>iPhoneではSafariの共有メニューからホーム画面に追加できます。</small></p>'}
else if(['deal','night','vote'].includes(s.phase)){let list=s.phase==='deal'?s.p:alive(),p=list[s.i];h+='<h1>'+({deal:'役職配布',night:'🌙 夜の行動',vote:'秘密投票'}[s.phase])+'</h1><small>'+(s.i+1)+' / '+list.length+'人</small><div class="meter"><div class="fill" style="width:'+100*(s.i+1)/list.length+'%"></div></div>';
if(!s.open)h+=gate(p);
else{h+='<section>';if(s.phase==='deal'){h+='<div class="center"><div class="big">'+E[p.r]+'</div><h2>'+esc(p.name)+'：'+R[p.r]+'</h2><p>'+desc[p.r]+'</p></div>';if('WF'.includes(p.r))h+='<p>人狼：'+s.p.filter(x=>x.r==='W').map(x=>esc(x.name)).join('・')+'</p>';if(p.r==='P')h+='<p>相方：'+s.p.filter(x=>x.r==='P'&&x.id!==p.id).map(x=>esc(x.name)).join('・')+'</p>';h+=btn('隠して次へ','dealnext')}
else if(s.phase==='vote'){h+='<h2>'+esc(p.name)+' さんの投票</h2>'+opts(alive().filter(x=>x.id!==p.id))+btn('投票を確定して隠す','votenext',false,pick<0)}
else{h+='<div class="center"><div class="big">'+E[p.r]+'</div><h2>'+R[p.r]+'</h2></div><p>'+desc[p.r]+'</p>';if(p.r==='W')h+='<p>生存中の人狼：'+alive().filter(x=>x.r==='W').map(x=>esc(x.name)).join('・')+'</p>';if('WSGDV'.includes(p.r)){if(s.investigation&&s.investigation.actor===p.id){let t=s.p[s.investigation.target];h+='<div class="result">調査結果：'+esc(t.name)+' は '+(p.r==='S'?(t.r==='W'?'人狼':'人狼ではない'):p.r==='D'?('WF'.includes(t.r)?'人狼陣営':'村人陣営'):('WSGDV'.includes(t.r)?'夜の能力あり':'夜の能力なし'))+'</div>'+btn('隠して次へ','nightnext')}else{h+=opts(alive().filter(x=>p.r==='W'?x.r!=='W':x.id!==p.id))+btn('決定',p.r==='W'||p.r==='G'?'nightnext':'investigate',false,pick<0)}}else{if(p.r==='M'&&s.last>=0)h+='<div class="result">'+esc(name(s.last))+' は '+(s.p[s.last].r==='W'?'人狼':'人狼ではない')+' でした。</div>';else h+='<p>今夜の操作はありません。</p>';h+=btn('確認して次へ','nightnext')}}h+='</section>'}}
else if(s.phase==='talk'||s.phase==='result'){h+='<h1>'+(s.phase==='talk'?'☀️ 朝になりました':'投票結果')+'</h1><section><p>'+esc(s.msg)+'</p><h3>生存者 '+alive().length+'人</h3>'+s.p.map(p=>'<span class="tag '+(p.alive?'':'out')+'">'+esc(p.name)+'</span>').join('')+'</section>';if(s.phase==='talk')h+='<section class="center"><h3>議論タイマー</h3><h2 id="clock">5:00</h2>'+btn(s.until?'一時停止':'開始／再開','timer',true)+btn('5分に戻す','timerreset',true)+btn('秘密投票へ','vote')+'</section>';else h+=btn('次の夜へ','night')}
else if(s.phase==='hunter'){h+='<h1>ハンター発動</h1><p>'+esc(s.msg)+'</p>';if(!s.open)h+=gate(s.p[s.hunter],'hunteropen');else h+='<section><h2>'+esc(name(s.hunter))+' さんが選択</h2>'+opts(alive())+btn('道連れを確定','hunter',false,pick<0)+'</section>'}
else if(s.phase==='end'){h+='<h1>🏆 '+s.win+'の勝利！</h1><p>'+esc(s.msg)+'</p><section>'+s.p.map(p=>'<div class="line"><span>'+esc(p.name)+'</span><b>'+E[p.r]+' '+R[p.r]+'</b></div>').join('')+'</section>'+btn('もう一度遊ぶ','reset')}
if(!['setup','end'].includes(s.phase))h+=btn('ゲームを終了','reset',true);app.innerHTML=h;tick()}
function settle(next){let w=alive().filter(p=>p.r==='W').length,o=alive().length-w;if(!w||w>=o){s.win=!w?'村人陣営':'人狼陣営';go('end')}else go(next)}
function remove(id,next){if(id>=0){s.p[id].alive=false;if(s.p[id].r==='H'&&alive().length){s.hunter=id;s.after=next;go('hunter');return}}settle(next)}
function tallyTop(v){let c={};v.forEach(([id,w])=>{if(id>=0)c[id]=(c[id]||0)+w});let m=Math.max(0,...Object.values(c));return Object.keys(c).filter(k=>c[k]===m).map(Number)}
function nightEnd(){let t=tallyTop(alive().filter(p=>p.r==='W').map(p=>[s.actions[p.id]??-1,1])),id=t.length?t[Math.floor(Math.random()*t.length)]:-1;if(alive().some(p=>p.r==='G'&&s.actions[p.id]===id))id=-1;s.msg=id<0?'昨夜の退場者はいません。':name(id)+' さんが退場しました。';s.msg+=alive().some(p=>p.r==='B'&&p.id!==id)?' 今朝もパンが焼かれました。':' 今朝はパンが焼かれませんでした。';s.until=0;s.remaining=300;remove(id,'talk')}
function seconds(){return s.until?Math.max(0,Math.ceil((s.until-Date.now())/1000)):s.remaining??300}function tick(){let e=document.getElementById('clock');if(e){let t=seconds();e.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}}
setInterval(tick,500);app.oninput=e=>{if(e.target.dataset.name!==undefined){s.names[+e.target.dataset.name]=e.target.value;save()}};
app.onchange=e=>{if(e.target.id==='num'){s.n=+e.target.value;s.custom=null;render()}else if(e.target.dataset.role!==undefined){s.custom=[...(s.custom||roles(s.n))];s.custom[+e.target.dataset.role]=e.target.value;save()}};
app.onclick=e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.p!==undefined){pick=+b.dataset.p;render();return}let a=b.dataset.a;if(a==='preset'){s.custom=null;render()}if(a==='start'){let names=s.names.slice(0,s.n).map(x=>x.trim()),rr=s.custom||roles(s.n),w=rr.filter(x=>x==='W').length,pc=rr.filter(x=>x==='P').length;if(names.some(x=>!x)||new Set(names).size!==s.n||!w||w>=s.n-w||pc===1||!rr.includes('F')||rr.filter(x=>x==='H').length>1){document.getElementById('error').textContent='名前は全員異なるものを入力。人狼と狂信者を含め、人狼は半数未満、共有者は0人または2人以上、ハンターは1人以下にしてください。';return}s.p=shuffle(rr).map((r,id)=>({r,id,name:names[id],alive:true}));s.day=1;s.last=-1;s.actions={};s.votes={};s.msg='';s.win='';go('deal')}if(a==='open'||a==='hunteropen'){s.open=true;render()}if(a==='dealnext'){s.i++;s.open=false;if(s.i>=s.p.length)go('night');else render()}if(a==='investigate'){s.investigation={actor:alive()[s.i].id,target:pick};render()}if(a==='nightnext'){let p=alive()[s.i];s.actions[p.id]=s.investigation?.target??pick;s.i++;s.open=false;pick=-1;s.investigation=null;if(s.i>=alive().length)nightEnd();else render()}if(a==='vote'){s.votes={};go('vote')}if(a==='votenext'){s.votes[alive()[s.i].id]=pick;s.i++;s.open=false;pick=-1;if(s.i>=alive().length){let t=tallyTop(alive().map(p=>[s.votes[p.id],p.r==='L'?2:1]));s.last=t.length===1?t[0]:-1;s.msg=s.last<0?'同票のため退場なし。':name(s.last)+' さんが投票で退場しました。';remove(s.last,'result')}else render()}if(a==='night'){s.day++;s.actions={};go('night')}if(a==='hunter'){let id=pick;s.p[id].alive=false;s.msg+=' '+name(id)+' さんが道連れになりました。';if(s.after==='talk'&&s.p[id].r==='B')s.msg=s.msg.replace('今朝もパンが焼かれました。','今朝はパンが焼かれませんでした。');settle(s.after)}if(a==='timer'){if(s.until){s.remaining=seconds();s.until=0}else{s.until=Date.now()+s.remaining*1000}render()}if(a==='timerreset'){s.until=0;s.remaining=300;render()}if(a==='reset'&&(s.phase==='end'||confirm('ゲームを終了しますか？'))){let n=s.n,names=s.names,custom=s.custom;s=fresh();s.n=n;s.names=names;s.custom=custom;render()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s.open){s.open=false;pick=-1;render()}});
try{render()}catch(e){app.textContent='ゲームの初期化に失敗しました。再読み込みしてください。';console.error(e)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
